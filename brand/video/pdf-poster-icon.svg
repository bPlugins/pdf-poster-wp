<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="PDF Poster: a PDF page turning inside a viewer with a control bar">
  <title>PDF Poster — page-flip viewer with controls</title>
  <defs>
    <linearGradient id="pdpAtile" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(45 .5 .5)">
      <stop offset="0" stop-color="#f7a547"/>
      <stop offset="1" stop-color="#ef5c30"/>
    </linearGradient>
    <linearGradient id="pdpAflip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7e2dc"/>
    </linearGradient>
    <radialGradient id="pdpAglow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pdpAclip"><rect x="0" y="0" width="256" height="256" rx="56"/></clipPath>
  </defs>

  <style>
    :root { --pdp: 3.6s; }
    #pdpA-flip {
      transform-box: fill-box; transform-origin: left center;
      animation: pdpA-turn var(--pdp) ease-in-out infinite;
    }
    #pdpA-flipShade { animation: pdpA-shade var(--pdp) ease-in-out infinite; }
    #pdpA-hi { animation: pdpA-slide var(--pdp) steps(1) infinite; }

    @keyframes pdpA-turn {
      0%, 16%    { transform: scaleX(1); }
      46%, 54%   { transform: scaleX(0.03); }
      84%, 100%  { transform: scaleX(1); }
    }
    @keyframes pdpA-shade {
      0%, 16% { opacity: 0; }
      46%, 54% { opacity: 0.5; }
      84%, 100% { opacity: 0; }
    }
    @keyframes pdpA-slide {
      0%, 20%   { transform: translateX(0); }
      20.01%,40%{ transform: translateX(38px); }
      40.01%,60%{ transform: translateX(76px); }
      60.01%,80%{ transform: translateX(114px); }
      80.01%,100%{ transform: translateX(152px); }
    }
    @media (prefers-reduced-motion: reduce) {
      #pdpA-flip, #pdpA-flipShade, #pdpA-hi { animation: none !important; }
      #pdpA-flip { transform: scaleX(0.4); }
      #pdpA-flipShade { opacity: 0.4; }
    }
  </style>

  <g clip-path="url(#pdpAclip)">
    <rect width="256" height="256" fill="url(#pdpAtile)"/>
    <circle cx="70" cy="60" r="90" fill="#ffffff" opacity="0.09"/>
    <ellipse cx="128" cy="118" rx="96" ry="96" fill="url(#pdpAglow)"/>

    <!-- viewer document -->
    <g>
      <rect x="70" y="44" width="116" height="134" rx="11" fill="#ffffff"/>
      <!-- base page content (revealed page) -->
      <rect x="82" y="58" width="34" height="15" rx="3.5" fill="#ef5c30"/>
      <text x="99" y="69.5" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">PDF</text>
      <rect x="82" y="86" width="92" height="6" rx="3" fill="#e9e3dc"/>
      <rect x="82" y="99" width="92" height="6" rx="3" fill="#efe9e2"/>
      <rect x="82" y="112" width="72" height="6" rx="3" fill="#efe9e2"/>
      <rect x="82" y="130" width="92" height="6" rx="3" fill="#efe9e2"/>
      <rect x="82" y="143" width="60" height="6" rx="3" fill="#efe9e2"/>

      <!-- turning page -->
      <g id="pdpA-flip">
        <rect x="70" y="44" width="116" height="134" rx="11" fill="url(#pdpAflip)"/>
        <rect x="82" y="58" width="34" height="15" rx="3.5" fill="#ef5c30"/>
        <text x="99" y="69.5" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">PDF</text>
        <rect x="82" y="86" width="92" height="6" rx="3" fill="#e6e0d8"/>
        <rect x="82" y="99" width="92" height="6" rx="3" fill="#ede7df"/>
        <rect x="82" y="112" width="72" height="6" rx="3" fill="#ede7df"/>
        <rect x="82" y="130" width="92" height="6" rx="3" fill="#ede7df"/>
        <rect x="82" y="143" width="60" height="6" rx="3" fill="#ede7df"/>
        <rect id="pdpA-flipShade" x="70" y="44" width="116" height="134" rx="11" fill="#000000" opacity="0"/>
      </g>
    </g>

    <!-- control bar -->
    <g>
      <rect x="40" y="192" width="176" height="34" rx="17" fill="#2b241f" opacity="0.92"/>
      <rect id="pdpA-hi" x="40" y="196" width="30" height="26" rx="9" fill="#ffffff" opacity="0.18"/>
      <!-- prev -->
      <path d="M57 203 l-6 6 l6 6" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- fullscreen -->
      <g stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M84 203 h-6 v6"/><path d="M96 203 h6 v6"/><path d="M84 215 h-6 v-6"/><path d="M96 215 h6 v-6"/>
      </g>
      <!-- download -->
      <g stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M128 202 v10"/><path d="M123 208 l5 5 l5 -5"/><path d="M121 217 h14"/>
      </g>
      <!-- print -->
      <g stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M161 205 v-4 h12 v4"/><path d="M158 205 h18 v8 h-3"/><rect x="161" y="211" width="12" height="7"/>
      </g>
      <!-- next -->
      <path d="M199 203 l6 6 l-6 6" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
