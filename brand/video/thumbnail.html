<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PDF Poster — Watermark Tutorial Thumbnails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@500;600;700&display=swap">
<style>
  /* ==================================================================
     YouTube thumbnails · 1280x720 each · rendered at 2x by thumbs.js
     Sized for the feed: the headline must survive being shown ~210px
     wide, so nothing carries meaning below ~60px of type.
     bPlugins brand: ink #070127 / blue #146EF5 / orange #FF7A00
     ================================================================== */
  :root{
    --ink:#070127;
    --ink-deep:#04010F;
    --blue:#146EF5;
    --blue-lift:#6BA5FF;
    --orange:#FF7A00;
    --amber:#F7A547;
    --ember:#EF5C30;
    --paper:#FFFFFF;
    --mist:#A9B6D8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#1A1A22;font-family:"IBM Plex Sans",Arial,sans-serif;padding:28px;
       display:flex;flex-direction:column;gap:34px;align-items:flex-start}
  .label{color:#8E9CC4;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}

  .thumb{
    position:relative;width:1280px;height:720px;flex:none;overflow:hidden;
    background:var(--ink);color:var(--paper);
  }
  .glow{
    position:absolute;inset:-18%;
    background:
      radial-gradient(46% 54% at 30% 38%, rgba(20,110,245,.50), transparent 66%),
      radial-gradient(40% 46% at 78% 70%, rgba(239,92,48,.26), transparent 70%);
  }
  .rules{
    position:absolute;inset:0;
    background:repeating-linear-gradient(to bottom,rgba(255,255,255,.05) 0 1px,transparent 1px 26px);
    -webkit-mask-image:radial-gradient(74% 66% at 46% 46%,#000 18%,transparent 80%);
            mask-image:radial-gradient(74% 66% at 46% 46%,#000 18%,transparent 80%);
  }
  .vign{position:absolute;inset:0;background:radial-gradient(118% 92% at 48% 48%,transparent 40%,rgba(4,1,15,.84) 100%)}

  /* the watermarked page — geometry from the plugin's own confidential.svg preset */
  .page{position:absolute;filter:drop-shadow(0 42px 74px rgba(4,1,15,.8))}
  .page svg{display:block;width:100%;height:auto}

  h1{
    font-family:"Space Grotesk",Arial,sans-serif;font-weight:700;
    letter-spacing:-.04em;line-height:.90;text-transform:uppercase;
  }
  h1 em{
    font-style:normal;
    background:linear-gradient(96deg,var(--amber),var(--ember) 82%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .eyebrow{
    display:inline-flex;align-items:center;gap:11px;
    font-size:23px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--blue-lift);
  }
  .eyebrow i{display:block;width:36px;height:3px;background:var(--blue);border-radius:2px}
  .chip{
    display:inline-flex;align-items:center;gap:12px;
    padding:12px 24px;border-radius:12px;
    background:linear-gradient(135deg,var(--orange),var(--ember));
    font-size:27px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;
    box-shadow:0 14px 34px rgba(239,92,48,.44);
  }

  /* brand lockup — bottom left, clear of YouTube's duration badge */
  .lock{position:absolute;left:56px;bottom:44px;display:flex;align-items:center;gap:15px}
  .lock .ic{width:56px;height:56px;border-radius:14px;overflow:hidden;flex:none;
            box-shadow:0 10px 24px rgba(239,92,48,.4)}
  .lock .ic svg{display:block;width:100%;height:100%}
  .lock .n{font-family:"Space Grotesk",Arial,sans-serif;font-weight:700;font-size:31px;letter-spacing:-.02em}
  .lock .sep{width:1px;height:30px;background:rgba(169,182,216,.4)}
  .lock .logo{height:31px;width:auto;display:block}

  /* ---------------- A · headline + stamped page ---------------- */
  #a .txt{position:absolute;left:56px;top:118px;width:660px}
  #a h1{font-size:127px;margin-top:20px}
  #a .chip{margin-top:30px}
  #a .page{right:-14px;top:46px;width:494px;transform:rotate(-5deg)}

  /* ---------------- B · before / after ---------------- */
  #b .band{
    position:absolute;left:0;right:0;bottom:0;height:186px;
    background:linear-gradient(to top,rgba(4,1,15,.97) 40%,rgba(4,1,15,0));
  }
  #b h1{position:absolute;left:56px;bottom:56px;font-size:96px;width:1170px}
  #b .pair{position:absolute;left:0;right:0;top:52px;display:flex;justify-content:center;align-items:center;gap:56px}
  #b .pair .page{position:relative;width:340px;filter:drop-shadow(0 30px 56px rgba(4,1,15,.78))}
  #b .tag{
    position:absolute;left:50%;top:-19px;transform:translateX(-50%);
    padding:7px 20px;border-radius:999px;font-size:21px;font-weight:700;
    letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;
  }
  #b .tag.off{background:#4A5468;color:#E7EDFB}
  #b .tag.on{background:linear-gradient(135deg,var(--orange),var(--ember));color:#fff}
  #b .arrow{flex:none;display:grid;place-items:center;width:96px;height:96px;border-radius:50%;
            background:linear-gradient(135deg,var(--orange),var(--ember));
            box-shadow:0 16px 38px rgba(239,92,48,.5)}
  #b .arrow svg{width:50px;height:50px}

  /* ---------------- C · the thumbnail itself is stamped ---------------- */
  #c .stamp{
    position:absolute;inset:0;opacity:.16;
    background-image:var(--stampUrl);background-size:520px auto;
  }
  #c .txt{position:absolute;left:0;right:0;top:150px;text-align:center}
  #c h1{font-size:158px}
  #c .sub{margin-top:26px;font-size:41px;font-weight:600;color:#E7EDFB;letter-spacing:-.01em}
  #c .chip{margin-top:34px}
  #c .lock{left:50%;transform:translateX(-50%);bottom:46px}
</style>
</head>
